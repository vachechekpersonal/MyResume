name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two Pages deployments at once; let the current one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --report-xunit-trx --results-directory TestResults
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
      - run: dotnet publish src/MyResume.Web --no-build --configuration Release --output publish
      - name: Prepare static site
        run: |
          set -euo pipefail
          site=publish/wwwroot
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"
          # Without a custom domain the site lives under /<repo>/ on github.io, so the base href must match.
          if [ ! -f "$site/CNAME" ]; then
            base="/${{ github.event.repository.name }}/"
            sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" "$site/index.html" "$site/404.html"
            echo "No CNAME found; base href set to $base"
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
